<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Банковская карта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e0e0e0;
            padding: 30px 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .form {
            flex: 2;
            min-width: 250px;
        }
        .card-area {
            flex: 1;
            min-width: 280px;
        }
        .card {
            background: black;
            border-radius: 16px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .bank {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .pay {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .card-number {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }
        .card-holder {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .card-expiry {
            font-size: 12px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        button {
            background: black;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            padding: 10px;
            font-weight: bold;
        }
        button:hover {
            background: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f0f0f0;
        }
        h3 {
            margin: 15px 0 5px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="form">
            <h3>Данные карты</h3>
            <form id="cardForm">
                <label>Название банка</label>
                <input type="text" id="bankName" autocomplete="off">

                <label>Платёжная система</label>
                <select id="paySystem">
                    <option value="">-- Выберите --</option>
                    <option value="Visa">Visa</option>
                    <option value="MasterCard">MasterCard</option>
                    <option value="Mir">Мир</option>
                </select>

                <label>Номер карты (16 цифр)</label>
                <input type="text" id="cardNumber" maxlength="19" placeholder="0000 0000 0000 0000" autocomplete="off">

                <label>Имя держателя (латиница)</label>
                <input type="text" id="cardHolder" placeholder="IVAN PETROV" autocomplete="off">

                <label>Срок действия (ММ/ГГ)</label>
                <input type="text" id="expiry" placeholder="03/23" maxlength="5" autocomplete="off">

                <button type="submit">Добавить карту</button>
            </form>
        </div>

        <div class="card-area">
            <div class="card">
                <div class="card-top">
                    <span class="bank" id="previewBank">Название банка</span>
                    <span class="pay" id="previewPay">Плат. система</span>
                </div>
                <div class="card-number" id="previewNumber">0000 0000 0000 0000</div>
                <div class="card-holder" id="previewHolder">ИМЯ ДЕРЖАТЕЛЯ</div>
                <div class="card-expiry" id="previewExpiry">срок: 00/00</div>
            </div>
        </div>
    </div>

    <h3>Сохранённые карты</h3>
    <table id="cardsTable">
        <thead>
            <tr><th>Банк</th><th>Плат. система</th><th>Номер карты</th><th>Держатель</th><th>Срок</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const bank = document.getElementById('bankName');
    const paySys = document.getElementById('paySystem');
    const number = document.getElementById('cardNumber');
    const holder = document.getElementById('cardHolder');
    const expiry = document.getElementById('expiry');
    const tbody = document.getElementById('tableBody');

    function showEmptyMessage() {
        tbody.innerHTML = '';
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.setAttribute('colspan', '5');
        cell.style.textAlign = 'center';
        cell.textContent = 'Нет карт';
        row.appendChild(cell);
        tbody.appendChild(row);
    }
    showEmptyMessage();

    function updatePreview() {
        document.getElementById('previewBank').textContent = bank.value.trim() || 'Название банка';
        document.getElementById('previewPay').textContent = paySys.value || 'Плат. система';
        
        let num = number.value.replace(/\s/g, '').slice(0, 16);
        let formatted = num.length ? num.match(/.{1,4}/g).join(' ') : '0000 0000 0000 0000';
        document.getElementById('previewNumber').textContent = formatted;
        
        let holderText = holder.value.trim().toUpperCase();
        document.getElementById('previewHolder').textContent = holderText || 'ИМЯ ДЕРЖАТЕЛЯ';
        document.getElementById('previewExpiry').textContent = expiry.value.trim() ? `срок: ${expiry.value}` : 'срок: 00/00';
    }

    function validate() {
        if (!bank.value.trim()) {
            console.log('Ошибка: не указано название банка');
            return false;
        }
        if (!paySys.value) {
            console.log('Ошибка: не выбрана платёжная система');
            return false;
        }
        let numClean = number.value.replace(/\s/g, '');
        if (!/^\d{16}$/.test(numClean)) {
            console.log('Ошибка: номер карты должен содержать 16 цифр');
            return false;
        }
        if (!holder.value.trim()) {
            console.log('Ошибка: не указано имя держателя');
            return false;
        }
        if (!/^[A-Za-z\s\.\-]+$/.test(holder.value.trim())) {
            console.log('Ошибка: имя держателя должно быть на латинице. Вы ввели: ' + holder.value.trim());
            return false;
        }
        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry.value.trim())) {
            console.log('Ошибка: срок должен быть в формате ММ/ГГ');
            return false;
        }
        return true;
    }

    function addToTable() {
        if (tbody.children.length === 1 && tbody.children[0].children[0].getAttribute('colspan') === '5') {
            tbody.innerHTML = '';
        }
        
        let numClean = number.value.replace(/\s/g, '');
        let numPretty = numClean.match(/.{1,4}/g).join(' ');
        
        const row = document.createElement('tr');
        
        const cellBank = document.createElement('td');
        cellBank.textContent = bank.value.trim();
        row.appendChild(cellBank);
        
        const cellPay = document.createElement('td');
        cellPay.textContent = paySys.value;
        row.appendChild(cellPay);
        
        const cellNum = document.createElement('td');
        cellNum.textContent = numPretty;
        row.appendChild(cellNum);
        
        const cellHolder = document.createElement('td');
        cellHolder.textContent = holder.value.trim().toUpperCase();
        row.appendChild(cellHolder);
        
        const cellExpiry = document.createElement('td');
        cellExpiry.textContent = expiry.value.trim();
        row.appendChild(cellExpiry);
        
        tbody.appendChild(row);
    }

    function resetForm() {
        bank.value = '';
        paySys.value = '';
        number.value = '';
        holder.value = '';
        expiry.value = '';
        updatePreview();
    }

    document.getElementById('cardForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (validate()) {
            addToTable();
            resetForm();
        }
    });

    number.addEventListener('input', function() {
        this.value = this.value.replace(/[^\d]/g, '').replace(/(\d{4})(?=\d)/g, '$1 ').slice(0, 19);
        updatePreview();
    });

    expiry.addEventListener('input', function() {
        let v = this.value.replace(/[^\d]/g, '');
        if (v.length >= 2) v = v.slice(0, 2) + '/' + v.slice(2, 4);
        this.value = v.slice(0, 5);
        updatePreview();
    });

    holder.addEventListener('input', updatePreview);
    bank.addEventListener('input', updatePreview);
    paySys.addEventListener('change', updatePreview);

    updatePreview();
</script>
</body>
</html>

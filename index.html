<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров с плюсами и минусами</title>
    <style>
        ul {
            list-style: none;
            margin-left: 20px;
            padding-left: 0;
        }
        li {
            margin: 5px 0;
        }
        .marker {
            font-weight: bold;
            margin-right: 5px;
        }
        ul[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Каталог товаров</h1>

    <ul id="catalog">
        <li>
            <span class="marker">+ </span><span class="item-text">Книги</span>
            <ul hidden>
                <li><span class="marker">+ </span><span class="item-text">Отечественные</span></li>
                <li>
                    <span class="marker">+ </span><span class="item-text">Зарубежные</span>
                    <ul hidden>
                        <li><span class="marker">+ </span><span class="item-text">Детективы</span></li>
                        <li><span class="marker">+ </span><span class="item-text">Научная фантастика</span></li>
                        <li><span class="marker">+ </span><span class="item-text">Исторические</span></li>
                    </ul>
                </li>
            </ul>
        </li>
        <li>
            <span class="marker">+ </span><span class="item-text">DVD</span>
            <ul hidden>
                <li>
                    <span class="marker">+ </span><span class="item-text">Отечественные</span>
                    <ul hidden>
                        <li><span class="marker">+ </span><span class="item-text">Детективы</span></li>
                        <li><span class="marker">+ </span><span class="item-text">Научная фантастика</span></li>
                        <li><span class="marker">+ </span><span class="item-text">Исторические</span></li>
                    </ul>
                </li>
                <li><span class="marker">+ </span><span class="item-text">Зарубежные</span></li>
            </ul>
        </li>
    </ul>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const items = document.querySelectorAll('#catalog li');

            items.forEach(function(li) {
                const submenu = li.querySelector(':scope > ul');
                const marker = li.querySelector('.marker');
                const textSpan = li.querySelector('.item-text');

                if (submenu) {
                    li.addEventListener('click', function(event) {
                        event.stopPropagation();
                        submenu.hidden = !submenu.hidden;
                        if (submenu.hidden) {
                            marker.textContent = '+ ';
                        } else {
                            marker.textContent = '- ';
                        }
                    });
                } else {
                    li.addEventListener('click', function(event) {
                        event.stopPropagation();
                    });
                }
            });
        });
    </script>
</body>
</html>
